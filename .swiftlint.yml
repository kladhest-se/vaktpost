# SwiftLint configuration for VaktPost

# Paths to exclude
excluded:
  - DerivedData
  - .build
  - Pods

# Rule configuration
opt_in_rules:
  - collection_alignment
  - contains_over_filter_is_empty
  - contains_over_filter_count
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - duplicate_enum_cases
  - dynamic_inline
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - for_where
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_random
  - modifier_order
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - sorted_first_last
  - superfluous_else
  - test_case_accessibility
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

# Rules disabled because they fight conventions this codebase already uses
# consistently throughout -- not oversights, deliberate house style:
#   - identifier_name's length floor: short, tightly-scoped names (q, ip, d,
#     gw, rx/tx...) are used the same way in dozens of files for local,
#     short-lived bindings whose meaning is clear from context.
#   - conditional_returns_on_newline: was opted into above but the codebase's
#     pervasive single-line `if x { return y }` / `guard ... else { return }`
#     style directly conflicts with it on nearly every file.
#   - trailing_comma: the codebase consistently keeps trailing commas in
#     multiline literals.
#   - statement_position, large_tuple: real style opinions, but not this
#     project's; left off rather than fighting existing, working code.
#   - force_try: appears almost entirely in XCTest fixtures, where it's the
#     normal idiom (failure there already fails the test). Turning this back
#     on and excluding just the Tests target would be the more precise fix
#     if force_try in production code specifically needs to stay flagged.
#   - multiple_closures_with_trailing_closure: conflicts with trailing_closure
#     above at existing multi-closure call sites (DashboardStore's
#     concurrent task launches).
#   - inclusive_language: flagged `MasterDetail`/`master`, which name the
#     master-detail UI pattern, not a real concern in this context.
disabled_rules:
  - trailing_whitespace
  - trailing_comma
  - statement_position
  - large_tuple
  - force_try
  - multiple_closures_with_trailing_closure
  - inclusive_language

included:

# Indentation
indentation: 4

# Identifier name: keep the rule (still catches reserved words etc.) but
# drop the length floor that fought the codebase's own short-binding style.
identifier_name:
  min_length:
    warning: 1
    error: 1

# Line length
# Raised from 120/150: plenty of existing lines (many doc comments and
# chained modifiers) already run longer. This does not cover every current
# outlier -- a handful of test-assertion lines run past 250 characters and
# will still show up; that's real information, not house style.
line_length:
  warning: 160
  error: 220

# Type body length
# Raised to cover DashboardStore (1318), WriteCoordinator (884), FirewallView
# (651), OverviewView (757), and similar. PHPSnippets.swift's struct body is
# 4161 lines and stays over even this: that one is a genuine outlier worth a
# deliberate decision (split the file, or accept and raise further) rather
# than a threshold picked to silently swallow it.
type_body_length:
  warning: 500
  error: 1400

# File length
# Same story as type_body_length: covers FirewallView.swift (2982) and
# DashboardStore.swift (1991); PHPSnippets.swift (4919) still exceeds this
# and is flagged deliberately rather than accommodated.
file_length:
  warning: 2000
  error: 3000

# Function body length
# Covers every current violation, including WriteCoordinator's largest
# (201 lines) and PHPSnippets' largest (336, the reorder snippet).
function_body_length:
  warning: 120
  error: 350

# Number of parameters
# Covers AuditTrail's 7-parameter call and Investigation's 12-parameter one.
function_parameter_count:
  warning: 7
  error: 12

# Nesting
nesting:
  type_level: 3
  function_level: 2

# Cyclomatic complexity
# Covers every current violation, including WriteCoordinator's worst (48).
cyclomatic_complexity:
  warning: 20
  error: 50

# Report formats
reporter: "xcode"
